services:
  postgres:
    image: postgres:16-alpine
    container_name: drawing_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pg_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DATABASE:-engineering_drawings}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-engineering_drawings}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: drawing_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_pg_pass_change_me}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-engineering_drawings}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - REVISION_STORAGE_DIR=/app/backend/storage
    ports:
      - "8000:8000"
    volumes:
      - revision_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: drawing_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  revision_storage:
    driver: local
